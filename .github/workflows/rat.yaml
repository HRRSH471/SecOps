name: Step 2 - Receive Application Trigger

on:
  repository_dispatch:
    types:
      - application_push

jobs:

  # ==================================================
  # Stage 1: Gitleaks Secret Scanning
  # ==================================================
  gitleaks:
    name: Gitleaks - Secret Scanning
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Step 1: Display received application information
      # --------------------------------------------------
      - name: Display Received Application Information
        run: |
          echo "=========================================="
          echo "SecOps Repo Received Application Trigger"
          echo "=========================================="

          echo "Application Repository: ${{ github.event.client_payload.repository }}"
          echo "Application Branch: ${{ github.event.client_payload.branch }}"
          echo "Application Commit SHA: ${{ github.event.client_payload.commit_sha }}"
          echo "Event Type: ${{ github.event.action }}"


      # --------------------------------------------------
      # Step 2: Checkout exact application commit
      # --------------------------------------------------
      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          token: ${{ secrets.APPLICATION_REPO_READ_TOKEN }}
          path: application


      # --------------------------------------------------
      # Step 3: Verify checked out commit
      # --------------------------------------------------
      - name: Verify Checked Out Commit
        run: |
          echo "=========================================="
          echo "Application Source Successfully Checked Out"
          echo "=========================================="

          echo "Expected Commit:"
          echo "${{ github.event.client_payload.commit_sha }}"

          echo "Actual Checked Out Commit:"
          git -C application rev-parse HEAD


      # --------------------------------------------------
      # Step 4: Scan application for leaked secrets
      # --------------------------------------------------
      - name: Step 4 - Scan for Application Secrets
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/application:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source=/repo \
            --no-git \
            --no-banner \
            --report-format json \
            --report-path /repo/gitleaks-report.json \
            --exit-code 1


      # --------------------------------------------------
      # Step 4A: Show detected secrets
      # --------------------------------------------------
      - name: Step 4A - Show Detected Secrets
        if: always()
        run: |
          echo "Gitleaks Findings:"
          echo "====================================="

          if [ -f "application/gitleaks-report.json" ]; then

            cat application/gitleaks-report.json | jq -r '
              .[] |
              "File: \(.File)\nLine: \(.StartLine)\nRule: \(.RuleID)\nSecret: \(.Match)\nCommit: \(.Commit // "N/A")\n---"
            '

          else
            echo "No report file found — either no secrets were detected or the scan did not run."
          fi


      # --------------------------------------------------
      # Step 4B: List scanned files
      # --------------------------------------------------
      - name: Step 4B - List Scanned Files
        run: |
          echo "Files Inside Gitleaks Scanning Scope:"
          echo "====================================="

          find application -type f -print


  # ==================================================
  # Stage 2: Trivy Dependency Scanning
  # ==================================================
  trivy:
    name: Trivy - Dependency Scanning
    runs-on: ubuntu-latest

    needs: gitleaks

    steps:

      # --------------------------------------------------
      # Step 1: Display application information
      # --------------------------------------------------
      - name: Display Received Application Information
        run: |
          echo "=========================================="
          echo "SecOps Repo received Application trigger"
          echo "=========================================="

          echo "Application Repository: ${{ github.event.client_payload.repository }}"
          echo "Application Branch: ${{ github.event.client_payload.branch }}"
          echo "Application Commit SHA: ${{ github.event.client_payload.commit_sha }}"


      # --------------------------------------------------
      # Step 2: Checkout exact application commit
      # --------------------------------------------------
      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          token: ${{ secrets.APPLICATION_REPO_READ_TOKEN }}
          path: application


      # --------------------------------------------------
      # Step 3: Verify checked out commit
      # --------------------------------------------------
      - name: Verify Checked Out Commit
        run: |
          echo "=========================================="
          echo "Application Source Successfully Checked Out"
          echo "=========================================="

          echo "Expected Commit:"
          echo "${{ github.event.client_payload.commit_sha }}"

          echo "Actual Checked Out Commit:"
          git -C application rev-parse HEAD


      # --------------------------------------------------
      # Step 4: Scan dependencies using Trivy
      # --------------------------------------------------
      - name: Step 4 - Scan Dependencies for Vulnerabilities
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/application:/repo" \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest \
            fs \
            /repo \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --format table \
            --exit-code 1


      # --------------------------------------------------
      # Step 5: Generate JSON report
      # --------------------------------------------------
      - name: Step 5 - Generate JSON Report of Findings
        if: always()
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/application:/repo" \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest \
            fs \
            /repo \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --format json \
            --output /repo/trivy-report.json \
            --exit-code 0


      # --------------------------------------------------
      # Step 6: Show vulnerability summary
      # --------------------------------------------------
      - name: Step 6 - Show Vulnerability Summary
        if: always()
        run: |
          echo "====================================="
          echo "Trivy Dependency Findings:"
          echo "====================================="

          if [ -f "application/trivy-report.json" ]; then

            cat application/trivy-report.json | jq -r '
              .Results[]? |
              select(.Vulnerabilities != null) |
              .Vulnerabilities[] |
              "Package: \(.PkgName)\nInstalled: \(.InstalledVersion)\nFixed In: \(.FixedVersion // "N/A")\nSeverity: \(.Severity)\nCVE: \(.VulnerabilityID)\n---"
            '

          else
            echo "No report file found — either no vulnerable dependencies were detected or the scan did not run."
          fi


      # --------------------------------------------------
      # Step 7: Upload Trivy report
      # --------------------------------------------------
      - name: Upload Trivy Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-dependency-report
          path: application/trivy-report.json