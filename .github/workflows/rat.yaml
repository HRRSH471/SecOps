name: SecOps Pipeline

on:
  repository_dispatch:
    types:
      - application_push

jobs:

  # =========================================================
  # Stage 1: Secret Scanning
  # =========================================================
  gitleaks:
    name: Gitleaks - Secret Scanning
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # Step 1: Display Application Information
      # -------------------------------------------------------
      - name: Display Received Application Information
        run: |
          echo "=========================================="
          echo "SecOps Repo received Application trigger"
          echo "=========================================="

          echo "Application Repository: ${{ github.event.client_payload.repository }}"
          echo "Application Branch: ${{ github.event.client_payload.branch }}"
          echo "Application Commit SHA: ${{ github.event.client_payload.commit_sha }}"
          echo "Event Type: ${{ github.event.action }}"


      # -------------------------------------------------------
      # Step 2: Checkout Exact Application Commit
      # -------------------------------------------------------
      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          token: ${{ secrets.APPLICATION_REPO_READ_TOKEN }}
          path: application


      # -------------------------------------------------------
      # Step 3: Verify Checked Out Commit
      # -------------------------------------------------------
      - name: Verify Checked Out Commit
        run: |
          echo "=========================================="
          echo "Application Source Successfully Checked Out"
          echo "=========================================="

          echo "Expected Commit:"
          echo "${{ github.event.client_payload.commit_sha }}"

          echo "Actual Checked Out Commit:"
          git -C application rev-parse HEAD


      # -------------------------------------------------------
      # Step 4: Gitleaks Secret Scan
      # -------------------------------------------------------
      - name: Step 4 - Scan for Application Secrets
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/application:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source=/repo \
            --no-git \
            --no-banner \
            --report-format json \
            --report-path /repo/gitleaks-report.json \
            --exit-code 1


      # -------------------------------------------------------
      # Step 5: Show Gitleaks Findings
      # -------------------------------------------------------
      - name: Step 5 - Show Detected Secrets
        if: always()
        run: |
          echo "Gitleaks Findings:"
          echo "====================================="

          if [ -f "application/gitleaks-report.json" ]; then
            cat application/gitleaks-report.json | jq -r '
              .[] |
              "File: \(.File)\nLine: \(.StartLine)\nRule: \(.RuleID)\nSecret: \(.Match)\nCommit: \(.Commit // "N/A")\n---"
            '
          else
            echo "No report file found."
          fi


      # -------------------------------------------------------
      # Step 6: List Scanned Files
      # -------------------------------------------------------
      - name: Step 6 - List Scanned Files
        if: always()
        run: |
          echo "Files Inside Gitleaks Scanning Scope:"
          echo "====================================="

          find application -type f -print


      # -------------------------------------------------------
      # Step 7: Upload Gitleaks Report
      # -------------------------------------------------------
      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: application/gitleaks-report.json
          if-no-files-found: ignore


  # =========================================================
  # Stage 2: Dependency Scanning
  # =========================================================
  trivy-deps:
    name: Trivy - Dependency Scanning
    runs-on: ubuntu-latest

    needs: gitleaks

    steps:

      # -------------------------------------------------------
      # Step 1: Display Application Information
      # -------------------------------------------------------
      - name: Display Received Application Information
        run: |
          echo "=========================================="
          echo "SecOps Repo received Application trigger"
          echo "for dependency scan"
          echo "=========================================="

          echo "Application Repository: ${{ github.event.client_payload.repository }}"
          echo "Application Branch: ${{ github.event.client_payload.branch }}"
          echo "Application Commit SHA: ${{ github.event.client_payload.commit_sha }}"


      # -------------------------------------------------------
      # Step 2: Checkout Exact Application Commit
      # -------------------------------------------------------
      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          token: ${{ secrets.APPLICATION_REPO_READ_TOKEN }}
          path: application


      # -------------------------------------------------------
      # Step 3: Verify Checked Out Commit
      # -------------------------------------------------------
      - name: Verify Checked Out Commit
        run: |
          echo "Application Source Successfully Checked Out"

          echo "Expected Commit:"
          echo "${{ github.event.client_payload.commit_sha }}"

          echo "Actual Commit:"
          git -C application rev-parse HEAD


      # -------------------------------------------------------
      # Step 4: Trivy Dependency Scan
      # -------------------------------------------------------
      - name: Step 4 - Scan Dependencies for Vulnerabilities
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/application:/repo" \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest \
            fs \
            /repo \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --format table \
            --exit-code 1


      # -------------------------------------------------------
      # Step 5: Generate Trivy JSON Report
      # -------------------------------------------------------
      - name: Step 5 - Generate JSON Report of Findings
        if: always()
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/application:/repo" \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest \
            fs \
            /repo \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --format json \
            --output /repo/trivy-fs-report.json \
            --exit-code 0


      # -------------------------------------------------------
      # Step 6: Show Vulnerability Summary
      # -------------------------------------------------------
      - name: Step 6 - Show Vulnerability Summary
        if: always()
        run: |
          echo "Trivy Dependency Findings:"
          echo "====================================="

          if [ -f "application/trivy-fs-report.json" ]; then

            cat application/trivy-fs-report.json | jq -r '
              .Results[]?
              | select(.Vulnerabilities != null)
              | .Vulnerabilities[]
              | "Package: \(.PkgName)\nInstalled: \(.InstalledVersion)\nFixed In: \(.FixedVersion // "N/A")\nSeverity: \(.Severity)\nCVE: \(.VulnerabilityID)\n---"
            '

          else
            echo "No report file found."
          fi


      # -------------------------------------------------------
      # Step 7: Upload Trivy FS Report
      # -------------------------------------------------------
      - name: Upload Trivy FS Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-dependency-report
          path: application/trivy-fs-report.json
          if-no-files-found: ignore


  # =========================================================
  # Stage 3: Docker Image Build + Image Scanning
  # =========================================================
  build-and-scan-image:
    name: Build & Scan Docker Image
    runs-on: ubuntu-latest

    needs: trivy-deps

    steps:

      # -------------------------------------------------------
      # Step 1: Display Application Information
      # -------------------------------------------------------
      - name: Display Received Application Information
        run: |
          echo "=========================================="
          echo "SecOps Repo received Application trigger"
          echo "for image build & scan"
          echo "=========================================="

          echo "Application Repository: ${{ github.event.client_payload.repository }}"
          echo "Application Branch: ${{ github.event.client_payload.branch }}"
          echo "Application Commit SHA: ${{ github.event.client_payload.commit_sha }}"


      # -------------------------------------------------------
      # Step 2: Checkout Exact Application Commit
      # -------------------------------------------------------
      - name: Checkout Exact Application Commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.commit_sha }}
          token: ${{ secrets.APPLICATION_REPO_READ_TOKEN }}
          path: application


      # -------------------------------------------------------
      # Step 3: Verify Checked Out Commit
      # -------------------------------------------------------
      - name: Verify Checked Out Commit
        run: |
          echo "Application Source Successfully Checked Out"

          echo "Expected Commit:"
          echo "${{ github.event.client_payload.commit_sha }}"

          echo "Actual Commit:"
          git -C application rev-parse HEAD


      # -------------------------------------------------------
      # Step 4: Verify Dockerfile
      # -------------------------------------------------------
      - name: Verify Dockerfile
        run: |
          echo "Checking backend Dockerfile..."

          if [ -f "application/backend/Dockerfile" ]; then
            echo "Dockerfile found:"
            ls -lh application/backend/Dockerfile
          else
            echo "ERROR: application/backend/Dockerfile not found!"
            exit 1
          fi


      # -------------------------------------------------------
      # Step 5: Build Docker Image
      # -------------------------------------------------------
      - name: Step 5 - Build Docker Image
        run: |
          docker build \
            -t hireflow-backend:${{ github.event.client_payload.commit_sha }} \
            -f application/backend/Dockerfile \
            application/backend


      # -------------------------------------------------------
      # Step 6: Scan Docker Image
      # -------------------------------------------------------
      - name: Step 6 - Scan Docker Image for Vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest \
            image \
            hireflow-backend:${{ github.event.client_payload.commit_sha }} \
            --severity CRITICAL,HIGH \
            --format table \
            --exit-code 1


      # -------------------------------------------------------
      # Step 7: Generate Image JSON Report
      # -------------------------------------------------------
      - name: Step 7 - Generate JSON Report of Image Findings
        if: always()
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/trivy-cache:/root/.cache/" \
            -v "${GITHUB_WORKSPACE}:/output" \
            aquasec/trivy:latest \
            image \
            hireflow-backend:${{ github.event.client_payload.commit_sha }} \
            --severity CRITICAL,HIGH \
            --format json \
            --output /output/trivy-image-report.json \
            --exit-code 0


      # -------------------------------------------------------
      # Step 8: Show Image Vulnerability Summary
      # -------------------------------------------------------
      - name: Step 8 - Show Image Vulnerability Summary
        if: always()
        run: |
          echo "Trivy Image Scan Findings:"
          echo "====================================="

          if [ -f "trivy-image-report.json" ]; then

            cat trivy-image-report.json | jq -r '
              .Results[]?
              | select(.Vulnerabilities != null)
              | .Vulnerabilities[]
              | "Package: \(.PkgName)\nInstalled: \(.InstalledVersion)\nFixed In: \(.FixedVersion // "N/A")\nSeverity: \(.Severity)\nCVE: \(.VulnerabilityID)\n---"
            '

          else
            echo "No report file found."
          fi


      # -------------------------------------------------------
      # Step 9: Upload Trivy Image Report
      # -------------------------------------------------------
      - name: Upload Trivy Image Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.json
          if-no-files-found: ignore
